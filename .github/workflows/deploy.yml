name: Deploy Presentations to GitHub Pages

# Site-flow: bouwt en deployt de site. Wacht nooit op PDF's (die staan op een
# GitHub Release, zie pdfs.yml). Draait alleen als site-relevante bestanden wijzigen.
on:
  push:
    branches:
      - main
    paths:
      - 'presentations/**'
      - 'shared/**'
      - 'admin/**'
      - 'scripts/build-index.js'
      - 'scripts/lib/**'
      - 'scripts/vendor-*.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Vendor (gecached)
        uses: ./.github/actions/vendor

      - name: Prepare build directory
        run: |
          mkdir -p dist
          cp -r presentations dist/
          cp -r shared dist/

      - name: Build Index Page
        # GITHUB_TOKEN: leest de PDF-release om per deck "PDF volgt" / "oude versie" te tonen.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:index

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
