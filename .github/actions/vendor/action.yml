name: Vendor assets
description: Node + gecachte shared/vendor en admin/vendor (npm ci + vendor alleen bij cache-miss).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
    - id: vendor-cache
      uses: actions/cache@v6
      with:
        path: |
          shared/vendor
          admin/vendor
        key: vendor-v1-${{ hashFiles('package-lock.json', 'scripts/vendor-*.js', 'admin/src/**') }}
    - if: steps.vendor-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci && npm run vendor
