<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>GLR Slide Studio | Presentaties bewerken</title>
  <link rel="icon" type="image/svg+xml" href="../shared/img/glr-logo.svg" />
  <link rel="stylesheet" href="./vendor/studio.css" />
</head>
<body>
  <!-- Verplichte Login Gate: bedekt de Studio totdat de docent is ingelogd. -->
  <div class="auth-gate" id="auth-gate">
    <div class="auth-gate__glow" aria-hidden="true"></div>
    <div class="auth-card">
      <div class="auth-card__brand"><span class="studio-brand__dot"></span>GLR Slide Studio</div>
      <p class="auth-card__loading">Bezig met laden…</p>
    </div>
  </div>

  <div class="studio">
    <header class="studio-topbar">
      <div class="studio-brand"><span class="studio-brand__dot"></span>GLR Slide Studio</div>

      <button type="button" class="topbtn topbtn--deck" id="open-btn" title="Presentaties openen">
        <span class="topbtn__icon" id="open-btn-icon"></span>
        <span class="topbtn__text">
          <span class="topbtn__title" id="deckname">Geen presentatie geopend</span>
          <span class="topbtn__sub" id="deckpath">Kies of maak een presentatie</span>
        </span>
        <span class="topbtn__chev" id="open-btn-chev"></span>
      </button>

      <div class="studio-history" role="group" aria-label="Ongedaan maken en opnieuw">
        <button type="button" class="studio-btn studio-btn--icon" id="undo-btn" disabled title="Ongedaan maken (Ctrl+Z)" aria-label="Ongedaan maken"></button>
        <button type="button" class="studio-btn studio-btn--icon" id="redo-btn" disabled title="Opnieuw (Ctrl+Y)" aria-label="Opnieuw"></button>
      </div>

      <div class="studio-modes" id="modes" role="tablist" aria-label="Weergave">
        <button type="button" data-mode="visual" class="is-active" title="Werk direct op de echte 16:9 slide">Visueel (16:9 Slide)</button>
        <button type="button" data-mode="split" title="Tekststructuur naast de slide">Split (Structuur + Slide)</button>
        <button type="button" data-mode="source" title="Ruwe Markdown/HTML (voor developers)">&lt;/&gt; Broncode</button>
      </div>

      <div class="deploy-status" id="deploy-status" hidden aria-live="polite"></div>

      <div class="studio-actions">
        <button type="button" class="studio-btn studio-btn--ai" id="ai-btn" title="AI Les-Assistent (Claude, Gemini, ChatGPT)"></button>
        <button type="button" class="studio-btn studio-btn--icon" id="standalone-btn" title="Open de standalone Reveal.js-presentatie in een apart venster" aria-label="Open standalone presentatie in apart venster"></button>
        <button type="button" class="studio-btn studio-btn--present" id="present-btn" title="Presenteer vanaf de huidige slide (F5)"></button>
        <button type="button" class="studio-btn" id="new-deck-btn" title="Nieuwe presentatie"></button>
        <button type="button" class="studio-btn studio-btn--primary" id="save-btn" title="Opslaan (Ctrl+S)"></button>
        <button type="button" class="studio-btn studio-btn--icon" id="download-btn" title="Download .md" aria-label="Download .md"></button>
        <div class="dropdown" id="dd-account">
          <button type="button" class="studio-btn studio-btn--icon" id="account-btn" data-toggle
                  title="Account &amp; verbinding" aria-label="Account en verbinding"></button>
          <div class="dropdown-menu dropdown-menu--account" id="account-menu"></div>
        </div>
      </div>
    </header>

    <div class="studio-body">
      <aside class="studio-sorter" id="sorter" aria-label="Slides"></aside>

      <main class="studio-center">
        <div class="studio-toolbar" id="toolbar" role="toolbar" aria-label="Blokken"></div>
        <div class="studio-panes" id="panes" data-mode="visual">
          <div class="studio-pane studio-pane--editor" id="editor-pane"><div class="studio-editor" id="editor"></div></div>
          <div class="studio-pane studio-pane--source" id="source-pane"></div>
          <div class="studio-pane studio-pane--preview">
            <div class="preview-label">Slide · 16:9 canvas — klik op een onderdeel om het te bewerken</div>
            <div class="preview-frame" id="preview"></div>
          </div>
        </div>
      </main>

      <aside class="studio-inspector" id="inspector" aria-label="Inspector"></aside>
    </div>

    <footer class="studio-status" id="status"><span id="status-text">Klaar.</span></footer>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="./vendor/studio.js"></script>
</body>
</html>
